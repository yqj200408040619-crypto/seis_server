[server]
host = 0.0.0.0
port = 18000
backlog = 128
recv_size = 8192
socket_timeout_sec = 120
tcp_keepalive = true
max_clients = 256

[storage]
base_dir = /var/lib/mseed-tcp-server
log_dir = /var/log/mseed-tcp-server
db_dir_name = devices
quarantine_dir_name = quarantine
commit_every_packets = 1

[parser]
# 0 means read miniSEED 2.x record length from Blockette 1000.
# If your instrument always sends a fixed length and has no Blockette 1000,
# set this to 512, 1024, 2048 or 4096.
fixed_record_length = 0
min_record_length = 256
max_record_length = 131072
max_buffer_bytes = 1048576
resync_scan_limit = 1048576
validate_with_obspy = true
store_unvalidated_packets = false
time_gap_tolerance_samples = 1.5
