<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark portal-nav">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-semibold" href="/dashboard">{{ brand }}</a>
    {% if user %}
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/dashboard">总览</a></li>
        <li class="nav-item"><a class="nav-link" href="/live">实时波形</a></li>
        <li class="nav-item"><a class="nav-link" href="/history">历史波形</a></li>
        {% if user.role == 'admin' %}
        <li class="nav-item"><a class="nav-link" href="/admin">管理</a></li>
        {% endif %}
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light small">{{ user.display_name or user.username }}</span>
        <form method="post" action="/logout" class="m-0"><button class="btn btn-sm btn-outline-light">退出</button></form>
      </div>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container-fluid px-4 py-4">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
