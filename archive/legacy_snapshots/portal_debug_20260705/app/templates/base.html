<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>


</head>
<body data-user-role="{{ user.get('role', '') if user else '' }}">
<nav class="navbar navbar-expand-lg navbar-dark portal-nav">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-semibold" href="/dashboard">{{ brand }}</a>
    <div class="ms-auto me-2 portal-lang-switch">
      <button id="langToggle" type="button" class="btn btn-sm btn-outline-light">English</button>
    </div>
    {% if user %}
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/dashboard">总览</a></li>
        <li class="nav-item"><a class="nav-link" href="/live">实时波形</a></li>
        <li class="nav-item"><a class="nav-link" href="/history">历史波形</a></li>
        <li class="nav-item"><a class="nav-link" href="/quality">数据质量</a></li>
        <li class="nav-item"><a class="nav-link" href="/alerts" data-i18n="nav.alerts">告警</a></li>
        <li class="nav-item"><a class="nav-link" href="/export">数据导出</a></li>
        {% if user.role == 'admin' %}
        <li class="nav-item"><a class="nav-link" href="/system" data-i18n="nav.system">系统</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin">管理</a></li>
        {% endif %}
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light small">{{ user.display_name or user.username }}</span>
        <form method="post" action="/logout" class="m-0"><button class="btn btn-sm btn-outline-light">退出</button></form>
      </div>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container-fluid px-4 py-4">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/i18n.js?v=20260701-i18n-full"></script>
  <script src="/static/js/i18n_cleanup.js?v=20260701-i18n-cleanup2"></script>
<script src="/static/js/i18n_stage2.js"></script>
<script src="/static/js/i18n_stage3.js?v=3"></script>
<script src="/static/js/i18n_stage4.js"></script>
<script src="/static/js/export_stage4.js"></script>
<script src="/static/js/permissions_stage5.js"></script>
<script src="/static/js/i18n_stage8_clean.js?v=stage8"></script>
<script src="/static/js/plotly_fix_stage8.js?v=stage8"></script>
</body>
</html>
<!-- STAGE5_ADMIN_NAV_GUARD: backend middleware + permissions_stage5.js enforce admin-only /admin and /system -->
