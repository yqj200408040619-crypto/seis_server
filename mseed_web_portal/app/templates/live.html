{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-end mb-4 flex-wrap gap-3">
  <div>
    <div class="portal-pill mb-2">Live waveform</div>
    <h1 class="h3 fw-bold mb-1">实时波形</h1>
    <p class="text-secondary mb-0">按固定间隔拉取最近一段时间数据，适合现场监控。</p>
  </div>
</div>

<div class="control-panel mb-4">
  <div class="row g-3 align-items-end">
    <div class="col-12 col-lg-4">
      <label class="form-label">设备</label>
      <select id="deviceSelect" class="form-select">
        {% for d in devices %}
        <option value="{{ d.id }}" {% if selected_device_id and selected_device_id == d.id %}selected{% endif %}>{{ d.label }} / {{ d.device_key }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label">时间窗口 / 秒</label>
      <input id="secondsInput" class="form-control" type="number" min="5" max="86400" value="{{ latest_default_seconds }}">
    </div>
    <div class="col-6 col-lg-2">
      <label class="form-label">刷新 / 秒</label>
      <input id="refreshInput" class="form-control" type="number" min="1" max="60" value="{{ refresh_seconds }}">
    </div>
    <div class="col-12 col-lg-4">
      <label class="form-label">分量</label>
      <div id="componentChecks" class="component-checks"></div>
    </div>
  </div>
</div>

<div class="chart-card">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <div>
      <h2 class="h6 fw-bold mb-0">三分量实时数据</h2>
      <div id="liveMeta" class="small text-secondary">等待数据...</div>
    </div>
    <button id="pauseBtn" class="btn btn-sm btn-outline-light">暂停</button>
  </div>
  <div id="liveChart" class="waveform-chart"></div>
</div>
<script src="/static/js/waveform.js"></script>
<script>window.portalMode = "live";</script>
{% endblock %}
