# Added 2026-10-30: the miniforge env only finds h5py via /home/ftp/.local,
# which root cannot see, so every run failed with ModuleNotFoundError.
# Use the portal venv, which the portal itself runs on.
[Service]
ExecStart=
ExecStart=/opt/mseed-web-portal/.venv/bin/python /opt/mseed-web-portal/tools/check_alerts.py
