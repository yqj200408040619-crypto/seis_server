# Added 2026-10-30. Canary peak was ~505 MB (concurrent dashboards + exports).
# Cap the portal so a runaway request restarts the portal alone instead of
# pushing the whole host into swap and a global OOM kill.
[Service]
Environment=MALLOC_ARENA_MAX=2
MemoryHigh=900M
MemoryMax=1200M
MemorySwapMax=256M
