<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<!-- STAGE10_I18N_HEAD -->
<script>
(function(){
  try {
    var keys = ["mseed.portal.lang","portalLangMode","mseed_lang","portal_lang","lang","i18nextLng"];
    var isEn = false;
    for (var i = 0; i < keys.length; i++) {
      var v = (localStorage.getItem(keys[i]) || "").toLowerCase();
      if (v === "en" || v.indexOf("en-") === 0) { isEn = true; break; }
      if (v === "zh" || v === "cn" || v.indexOf("zh") === 0) { isEn = false; break; }
    }
    if (isEn) document.documentElement.classList.add("mseed-i18n-loading");
    window.__mseedI18nStage10Unlock = function(){ document.documentElement.classList.remove("mseed-i18n-loading"); };
    setTimeout(function(){ document.documentElement.classList.remove("mseed-i18n-loading"); }, 2500);
  } catch(e) {}
})();
</script>
<style>html.mseed-i18n-loading body { opacity: 0 !important; }</style>
</head>
<body data-user-role="{{ user.get('role', '') if user else '' }}">
{% if user %}
<button class="sidebar-backdrop" type="button" aria-label="关闭菜单"></button>
<aside class="portal-sidebar" id="portalSidebar">
  <div class="sidebar-brand"><a class="navbar-brand fw-semibold" href="/dashboard">{{ brand }}</a></div>
  <nav class="sidebar-nav" aria-label="主菜单">
    <a class="nav-link" href="/dashboard">总览</a>
    <a class="nav-link" href="/live">实时波形</a>
    <a class="nav-link" href="/history">历史波形</a>
    <a class="nav-link" href="/quality">数据质量</a>
    <a class="nav-link" href="/alerts" data-i18n="nav.alerts">告警</a>
    <a class="nav-link" href="/export">数据导出</a>
    <a class="nav-link" href="/map">台站地图</a>
    {% if user.role == 'admin' %}
    <a class="nav-link" href="/system" data-i18n="nav.system">系统</a>
    <a class="nav-link" href="/admin">管理</a>
    {% endif %}
  </nav>
  <div class="sidebar-account">
    <span class="text-light small">{{ user.display_name or user.username }}</span>
    <div class="portal-lang-switch"><button id="langToggleSidebar" data-lang-toggle type="button" class="btn btn-sm btn-outline-light w-100">English</button></div>
    <form method="post" action="/logout" class="m-0"><button class="btn btn-sm btn-outline-light w-100">退出</button></form>
  </div>
</aside>
<header class="portal-mobile-header">
  <button class="sidebar-toggle" type="button" aria-controls="portalSidebar" aria-expanded="false" aria-label="打开菜单"><span></span><span></span><span></span></button>
  <a class="navbar-brand fw-semibold" href="/dashboard">{{ brand }}</a>
  <div class="portal-lang-switch"><button id="langToggle" data-lang-toggle type="button" class="btn btn-sm btn-outline-light">English</button></div>
</header>
<main class="portal-main container-fluid px-4 py-4">
{% else %}
<nav class="navbar navbar-expand-lg navbar-dark portal-nav"><div class="container-fluid px-4"><a class="navbar-brand fw-semibold" href="/dashboard">{{ brand }}</a><div class="ms-auto portal-lang-switch"><button id="langToggle" data-lang-toggle type="button" class="btn btn-sm btn-outline-light">English</button></div></div></nav>
<main class="container-fluid px-4 py-4">
{% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/export_stage4.js"></script>
<script src="/static/js/permissions_stage5.js"></script>
<script src="/static/js/i18n_stage10_complete.js?v=stage10"></script>
<script src="/static/js/i18n_stage10_1_textfix.js?v=stage10_1"></script>
<script>
(function(){var b=document.querySelector('.sidebar-toggle'),s=document.querySelector('.portal-sidebar'),o=document.querySelector('.sidebar-backdrop');if(!b||!s)return;function setOpen(v){s.classList.toggle('is-open',v);if(o)o.classList.toggle('is-visible',v);b.setAttribute('aria-expanded',v?'true':'false');}b.addEventListener('click',function(){setOpen(!s.classList.contains('is-open'));});if(o)o.addEventListener('click',function(){setOpen(false);});s.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){setOpen(false);});});})();
</script>
</body>
</html>
